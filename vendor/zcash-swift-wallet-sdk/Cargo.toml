[package]
name = "libzcashlc"
version = "3.0.0-zignal.1"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.97"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.16" }
pasta_curves = "0.6"
ff = "0.14"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
transparent = { package = "zcash_transparent", version = "0.11", default-features = false }
zcash_address = { version = "0.14" }
zcash_client_backend = { version = "0.25", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "0.23", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = "0.31"
zcash_proofs = "0.31"
zcash_protocol = { version = "0.11", features = ["local-consensus"] }
# Zignal fork: pool migration is left out (see ZIGNAL-PATCHES.md); its FFI is stubbed.
# zcash_pool_migration = { version = "0.2", features = ["wallet"] }
zcash_script = "0.6"
zip32 = "0.3"
pczt = { version = "0.10", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.8"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# upstream `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
# Zignal fork: Keystone UR deps removed with the migration flow.

# EIP-681
# Zignal fork: EIP-681 parsing is left out; its FFI is stubbed.
# eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.3"
schemerz-rusqlite = "0.371"
secrecy = "0.8"
rand = "0.10"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.14"
tor-rtcompat = "0.43"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting — off on this line; the `voting` module is gated behind `cfg(zcash_voting)`
# (see rust/src/lib.rs). Uncomment together with the `voting` feature, the `[patch.crates-io]`
# stanza below, and orchard's `unstable-voting-circuits` feature to reinstate it.
# zcash_voting = { version = "2.0.0-rc.1", optional = true }
# zeroize = "1"

# Used by the pool-migration engine as well as (when enabled) voting, so these stay compiled.
zcash_keys = { version = "0.17", features = ["orchard"] }
incrementalmerkletree = { version = "0.9", default-features = false }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

#voting = ["dep:zcash_voting"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_voting)'] }

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.
# Zignal fork: no librustzcash git pins; builds on the NU7 releases of 2026-10-21/22.

# Reinstate together with the voting dependencies above:
# zcash_voting = { git = "https://github.com/valargroup/zcash_voting.git", rev = "e53e74487d31ad0f5713580fb2f0222b53ae9db8" }
